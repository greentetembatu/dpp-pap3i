<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Halaman Tidak Ditemukan | P-AP3I</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0d6efd" />
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0d6efd 0%, #6610f2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .container {
      text-align: center;
      max-width: 560px;
    }
    .code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 1;
      opacity: 0.25;
      letter-spacing: -4px;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      margin: -10px 0 16px;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 32px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn-primary {
      background: #fff;
      color: #0d6efd;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }
    a.btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }
    a.btn-outline {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }
    a.btn-outline:hover {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/logo.jpeg" alt="P-AP3I" class="logo" />
    <div class="code">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>
      Maaf, halaman yang Anda cari tidak ada atau sudah dipindahkan.
      Silakan kembali ke beranda atau hubungi kami jika membutuhkan bantuan.
    </p>
    <div class="buttons">
      <a href="/" class="btn btn-primary">🏠 Kembali ke Beranda</a>
      <a href="/kontak.html" class="btn btn-outline">Hubungi Kami</a>
    </div>
  </div>
</body>
</html>
